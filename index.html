<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastoder Dev Blog | Test Page</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .status-pill {
      display: inline-block;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 20px;
      text-transform: uppercase;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: #ffffff;
    }

    p {
      color: #94a3b8;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-block;
      background-color: #3b82f6;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .btn:hover {
      background-color: #2563eb;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 30px;
      font-size: 0.8rem;
      color: #64748b;
    }

    footer a {
      color: #94a3b8;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">
    <span class="status-pill">● Deployment Test</span>
    <h1>Rastoder Dev Blog</h1>
    <p>If you see this dark mode card with styled buttons, your GitHub Pages setup and deployment pipeline are working properly!</p>
    
    <a href="https://github.com/KRastoder/rastoder-dev-blog" target="_blank" class="btn">View GitHub Repo</a>

    <footer>
      © 2026 Kenan Rastoder • Open source under the 
      <a href="./LICENSE" target="_blank">MIT License</a>
    </footer>
  </div>

</body>
</html>
